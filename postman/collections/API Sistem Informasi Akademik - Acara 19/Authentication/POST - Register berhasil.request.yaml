$kind: http-request
description: |-
  **Controller:** `AuthController`  
  **Method:** `register()`

  **Fungsi:** Menangani proses pendaftaran akun pengguna baru.
url: http://localhost/WebServer/acara19/public/register
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "username": "nindi",
      "email": "abc",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 Created', function () { pm.response.to.have.status(201); });
      pm.test('Response JSON punya success true', function () { pm.expect(pm.response.json().success).to.eql(true); });
    language: text/javascript
examples: .resources/POST - Register berhasil.resources/examples
order: 1000
